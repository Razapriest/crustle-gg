<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="navbar">
    <nav style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:#eee;">

        <!-- LEFT -->
        <div>
            <a href="/">Home</a>
            <a href="/post/create-deck-post">Create Deck Post</a>
            <a href="/post/create-tournament-post">Create Tournament Post</a>
        </div>

        <!-- RIGHT -->
        <div sec:authorize="isAuthenticated()"
             th:if="${loggedUser != null}"
             style="display:flex; align-items:center; gap:12px;">

            <a th:href="@{'/user/' + ${loggedUser.username}}"
               style="display:flex; align-items:center; gap:8px; text-decoration:none; color:black;">

                <img th:src="${loggedUser.profilePicture}"
                     width="35"
                     height="35"
                     style="border-radius:50%; object-fit:cover; border:1px solid #ccc;"/>

                <span th:text="${loggedUser.username}"></span>
            </a>

            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit">Logout</button>
            </form>

        </div>

        <div sec:authorize="isAnonymous()">
            <a href="/login">Login</a>
            <a href="/register" style="margin-left:10px;">Register</a>
        </div>

    </nav>
</div>

</body>
</html>
