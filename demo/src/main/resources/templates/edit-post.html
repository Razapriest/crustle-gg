<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Post</title>
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<h2>Edit Deck</h2>

<form th:action="@{'/post/edit/' + ${post.id}}" method="post">

    <input type="text" name="title" th:value="${post.title}" />

    <textarea name="deckList" th:text="${post.deckList}"></textarea>

    <textarea name="extraInfo" th:text="${post.extraInfo}"></textarea>

    <input type="text" name="imageUrl" th:value="${post.imageUrl}" />

    <button type="submit">Save</button>
</form>

</body>
</html>
