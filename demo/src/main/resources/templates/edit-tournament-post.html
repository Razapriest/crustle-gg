<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Tournament Post</title>

    <style>
        .archetype-picker {
            position: relative;
            width: 220px;
        }

        .archetype-search {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }

        .archetype-dropdown {
            border: 1px solid #ccc;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            position: absolute;
            width: 100%;
            background: white;
            z-index: 1000;
        }

        .archetype-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            cursor: pointer;
        }

        .archetype-option:hover {
            background-color: #f0f0f0;
        }

        .archetype-option img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .preview-img {
            margin-top: 10px;
            width: 150px;
            height: auto;
            border-radius: 6px;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<h2>Edit Tournament Post</h2>

<form th:action="@{'/post/edit/' + ${post.id}}"
      method="post"
      enctype="multipart/form-data">

    <!-- TITLE -->
    <input type="text"
           name="title"
           th:value="${post.title}"
           required />
    <br><br>

    <!-- IMAGE UPLOAD -->
    <label>Change Image</label><br>
    <input type="file" name="imageFile" accept="image/*" />
    <br><br>

    <!-- CURRENT IMAGE -->
    <div th:if="${post.imagePath != null}">
        <p>Current image:</p>
        <img class="preview-img"
             th:src="@{'/uploads/' + ${post.imagePath}}" />
    </div>

    <!-- fallback -->
    <div th:if="${post.imagePath == null}">
        <p>Current image:</p>
        <img class="preview-img"
             src="/uploads/default.png" />
    </div>

    <br>

    <!-- DESCRIPTION -->
    <textarea name="description"
              rows="5"
              cols="50"
              th:text="${post.description}">
    </textarea>

    <br><br>

    <h3>Players</h3>

    <table border="1">
        <thead>
        <tr>
            <th>Name</th>
            <th>Archetype</th>
            <th>Deck Link</th>
            <th>Score</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody id="body">

        <tr th:each="e : ${post.entries}">

            <!-- NAME -->
            <td>
                <input type="text"
                       name="playerName"
                       th:value="${e.playerName}"
                       required />
            </td>

            <!-- ARCHETYPE -->
            <td>
                <div class="archetype-picker">

                    <input type="text"
                           class="archetype-search"
                           placeholder="Search archetype..."
                           th:value="${e.archetype != null ? e.archetype.displayName : ''}"
                           autocomplete="off"
                           required />

                    <input type="hidden"
                           name="archetype"
                           class="selected-archetype"
                           th:value="${e.archetype != null ? e.archetype.name() : ''}"
                           required />

                    <div class="archetype-dropdown"></div>

                </div>
            </td>

            <!-- DECK LINK -->
            <td>
                <input type="text"
                       name="deckLink"
                       th:value="${e.deckLink}" />
            </td>

            <!-- SCORE -->
            <td>
                <input type="text"
                       name="score"
                       placeholder="3-1-0"
                       th:value="${e.score}" />
            </td>

            <!-- ACTIONS -->
            <td>
                <button type="button" onclick="moveUp(this)">⬆</button>
                <button type="button" onclick="moveDown(this)">⬇</button>
                <button type="button" onclick="this.closest('tr').remove()">X</button>
            </td>

        </tr>

        </tbody>
    </table>

    <br>

    <button type="button" onclick="addRow()">Add Player</button>

    <br><br>

    <button type="submit">Save Changes</button>

</form>

<!-- ARCHETYPE DATA -->
<div id="archetypeData" style="display:none;">
    <div th:each="a : ${archetypes}"
         class="archetype-data-item"
         th:data-value="${a.name()}"
         th:data-name="${a.displayName}"
         th:data-icon="${a.iconPath}">
    </div>
</div>

<!-- TEMPLATE -->
<template id="rowTemplate">
    <tr>

        <td>
            <input type="text" name="playerName" required />
        </td>

        <td>
            <div class="archetype-picker">

                <input type="text"
                       class="archetype-search"
                       placeholder="Search archetype..."
                       autocomplete="off"
                       required />

                <input type="hidden"
                       name="archetype"
                       class="selected-archetype"
                       required />

                <div class="archetype-dropdown"></div>

            </div>
        </td>

        <td>
            <input type="text" name="deckLink" />
        </td>

        <td>
            <input type="text" name="score" placeholder="3-1-0" />
        </td>

        <td>
            <button type="button" onclick="moveUp(this)">⬆</button>
            <button type="button" onclick="moveDown(this)">⬇</button>
            <button type="button" onclick="this.closest('tr').remove()">X</button>
        </td>

    </tr>
</template>

<script>
    function buildDropdown(dropdown) {
        dropdown.innerHTML = "";

        document.querySelectorAll(".archetype-data-item").forEach(a => {
            const option = document.createElement("div");
            option.className = "archetype-option";

            option.dataset.value = a.dataset.value;
            option.dataset.name = a.dataset.name;

            option.innerHTML = `
                <img src="${a.dataset.icon}">
                <span>${a.dataset.name}</span>
            `;

            dropdown.appendChild(option);
        });
    }

    function setupArchetypePicker(container) {
        const search = container.querySelector(".archetype-search");
        const hidden = container.querySelector(".selected-archetype");
        const dropdown = container.querySelector(".archetype-dropdown");

        buildDropdown(dropdown);

        dropdown.querySelectorAll(".archetype-option").forEach(option => {
            option.addEventListener("click", function () {
                search.value = this.dataset.name;
                hidden.value = this.dataset.value;
                dropdown.style.display = "none";
            });
        });

        search.addEventListener("focus", () => {
            dropdown.style.display = "block";
        });

        search.addEventListener("input", function () {
            const value = this.value.toLowerCase();

            dropdown.querySelectorAll(".archetype-option").forEach(option => {
                option.style.display =
                    option.dataset.name.toLowerCase().includes(value)
                        ? "flex"
                        : "none";
            });
        });

        document.addEventListener("click", e => {
            if (!container.contains(e.target)) {
                dropdown.style.display = "none";
            }
        });
    }

    function initRows() {
        document.querySelectorAll(".archetype-picker").forEach(setupArchetypePicker);
    }

    function addRow() {
        const clone = document.getElementById("rowTemplate").content.cloneNode(true);
        document.getElementById("body").appendChild(clone);

        const row = document.getElementById("body").lastElementChild;
        setupArchetypePicker(row.querySelector(".archetype-picker"));
    }

    function moveUp(btn) {
        const row = btn.closest("tr");
        const prev = row.previousElementSibling;
        if (prev) row.parentNode.insertBefore(row, prev);
    }

    function moveDown(btn) {
        const row = btn.closest("tr");
        const next = row.nextElementSibling;
        if (next) row.parentNode.insertBefore(next, row);
    }

    initRows();
</script>

</body>
</html>
