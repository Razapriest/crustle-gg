<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Deck Post</title>
</head>
<body>

<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar"></div>

<h2>Create New Deck Post</h2>

<form th:action="@{/post/create-deck-post}" method="post">

    <!-- CSRF TOKEN (safe version) -->
    <input type="hidden"
           th:if="${_csrf != null}"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />

    <input type="text"
           name="title"
           placeholder="Deck Name"
           required />
    <br><br>

    <input type="text"
           name="imageUrl"
           placeholder="Image URL (optional)" />
    <br><br>

    <textarea name="deckList"
              placeholder="Deck List"
              rows="10"
              cols="50"
              required></textarea>

    <br><br>

    <label>Archetype:</label>
    <select name="archetype" required>
        <option value="DRAGAPULT">Dragapult</option>
        <option value="CRUSTLE">Crustle</option>
        <option value="MEWTWO">Mewtwo</option>
        <option value="OGERPON">Ogerpon</option>
        <option value="FESTIVAL">Festival</option>
        <option value="GARCHOMP">Garchomp</option>
        <option value="OTHER">Other</option>
    </select>

    <br><br>

    <textarea name="description"
              placeholder="Description / Strategy"
              rows="5"
              cols="50"></textarea>

    <br><br>

    <button type="submit">Post Deck</button>

</form>

<br>

<a th:href="@{/}">Back to Home</a>

</body>
</html>
