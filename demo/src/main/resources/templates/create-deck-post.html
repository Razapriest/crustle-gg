<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Deck Post</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2>Create New Deck Post</h2>

<form th:action="@{/post/create-deck-post}"
      method="post"
      enctype="multipart/form-data">

    <!-- CSRF -->
    <input type="hidden"
           th:if="${_csrf != null}"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />

    <!-- TITLE -->
    <input type="text"
           name="title"
           placeholder="Deck Name"
           required />

    <br><br>

    <!-- IMAGE -->
    <div class="upload-box">
        <label>Deck Image:</label><br>
        <input type="file"
               name="imageFile"
               accept="image/*" />
    </div>

    <br>

    <!-- DECK LIST -->
    <textarea name="deckList"
              placeholder="Deck List"
              rows="10"
              cols="50"
              required></textarea>

    <br><br>

    <!-- ARCHETYPE -->
    <label>Archetype:</label><br>

    <div class="archetype-picker">

        <input type="text"
               id="archetypeSearch"
               class="archetype-search"
               placeholder="Search archetype..."
               autocomplete="off"
               required />

        <input type="hidden"
               name="archetype"
               id="selectedArchetype"
               required />

        <div id="archetypeDropdown" class="archetype-dropdown">

            <div th:each="a : ${archetypes}"
                 class="archetype-option"
                 th:data-value="${a.name()}"
                 th:data-name="${a.displayName}">

                <img th:src="${a.iconPath}" th:alt="${a.displayName}" />
                <span th:text="${a.displayName}"></span>

            </div>

        </div>
    </div>

    <br><br>

    <!-- DESCRIPTION -->
    <textarea name="description"
              placeholder="Description / Strategy"
              rows="5"
              cols="50"></textarea>

    <br><br>

    <button type="submit">Post Deck</button>

</form>

<br>

<a th:href="@{/}">Back to Home</a>

<script>
    const picker = document.querySelector(".archetype-picker");
    const searchInput = document.getElementById("archetypeSearch");
    const dropdown = document.getElementById("archetypeDropdown");
    const hiddenInput = document.getElementById("selectedArchetype");
    const options = dropdown.querySelectorAll(".archetype-option");

    searchInput.addEventListener("focus", () => {
        dropdown.style.display = "block";
    });

    searchInput.addEventListener("input", function () {
        const value = this.value.toLowerCase();
        dropdown.style.display = "block";

        options.forEach(option => {
            option.style.display =
                option.dataset.name.toLowerCase().includes(value)
                    ? "flex"
                    : "none";
        });
    });

    options.forEach(option => {
        option.addEventListener("click", function () {
            searchInput.value = this.dataset.name;
            hiddenInput.value = this.dataset.value;
            dropdown.style.display = "none";
        });
    });

    document.addEventListener("click", function (e) {
        if (!picker.contains(e.target)) {
            dropdown.style.display = "none";
        }
    });
</script>

</body>
</html>
