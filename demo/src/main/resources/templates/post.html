<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Post</title>
</head>
<body>

<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- POST CONTENT -->
<h1 th:text="${post.title}"></h1>

<p>
    By <span th:text="${post.author}"></span>
    |
    <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy HH:mm')}"></span>
</p>

<img th:src="${post.imageUrl}" width="300"/>

<h3>Deck List</h3>
<pre th:text="${post.deckList}"></pre>

<h3>Description</h3>
<p th:text="${post.description}"></p>

<!-- LIKE / DISLIKE -->
<form th:action="@{'/post/' + ${post.id} + '/like'}" method="post" style="display:inline;">
    <button type="submit"
            th:style="${userVote == 1} ? 'background-color:lightgreen;' : ''">
        👍 Like
    </button>
</form>

<form th:action="@{'/post/' + ${post.id} + '/dislike'}" method="post" style="display:inline;">
    <button type="submit"
            th:style="${userVote == -1} ? 'background-color:lightcoral;' : ''">
        👎 Dislike
    </button>
</form>

<p>Likes: <span th:text="${post.likes}"></span></p>
<p>Dislikes: <span th:text="${post.dislikes}"></span></p>

<!-- EDIT / DELETE (OWNER ONLY) -->
<div th:if="${post.author == currentUser}">

    <a th:href="@{'/post/edit/' + ${post.id}}">Edit</a>

    <form th:action="@{'/post/delete/' + ${post.id}}" method="post">
        <button type="submit">Delete</button>
    </form>

</div>

<hr>

<!-- COMMENTS -->
<h3>Comments</h3>

<div th:each="c : ${post.comments}">
    <p>
        <b th:text="${c.author}"></b>
        <span th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy HH:mm')}"></span>:
        <span th:text="${c.content}"></span>

    <form th:if="${c.author == currentUser}"
          th:action="@{'/comment/delete/' + ${c.id}}"
          method="post"
          style="display:inline;">

        <button type="submit">Delete</button>

    </form>
    </p>
</div>

<!-- ADD COMMENT -->
<form th:action="@{'/post/' + ${post.id} + '/comment'}" method="post">

    <input type="text" name="content" placeholder="Write a comment..." />

    <button type="submit">Post</button>

</form>

<br>

<a href="/">Back</a>

</body>
</html>
