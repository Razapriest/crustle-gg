<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>

    <style>
        .container {
            display: flex;
            gap: 20px;
        }

        .column {
            flex: 1;
        }

        .post-card {
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .buttons {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<h1>Home</h1>

<!-- CREATE -->
<div class="buttons">
    <a href="/post/create-deck-post">Create Deck Post</a>
    <a href="/post/create-tournament-post">Create Tournament Post</a>
</div>

<!-- SORT -->
<div>
    <a th:href="@{/(sort='new', page=0)}">Newest</a>
    |
    <a th:href="@{/(sort='top', page=0)}">Top Rated</a>
</div>

<hr>

<div class="container">

    <!-- ========================= -->
    <!-- DECK POSTS -->
    <!-- ========================= -->
    <div class="column">
        <h2>Deck Posts</h2>

        <div th:each="post : ${posts.content}"
             th:if="${post.type.name() == 'DECK'}"
             class="post-card">

            <a th:href="@{'/post/view/' + ${post.id}}"
               style="text-decoration:none; color:black;">

                <h3>
                    <span th:text="${post.title}"></span>

                    <span th:if="${post.archetype != null}"
                          th:text="' (' + ${post.archetype} + ')'">
                    </span>
                </h3>

                <p>By <span th:text="${post.author.username}"></span></p>

                <img th:src="${post.imageUrl != null ? post.imageUrl : 'https://via.placeholder.com/150'}"
                     width="150"/>

            </a>

            <p>
                👍 <span th:text="${post.likes}"></span>
                👎 <span th:text="${post.dislikes}"></span>
            </p>

        </div>
    </div>

    <!-- ========================= -->
    <!-- TOURNAMENT POSTS -->
    <!-- ========================= -->
    <div class="column">
        <h2>Tournament Posts</h2>

        <div th:each="post : ${posts.content}"
             th:if="${post.type.name() == 'TOURNAMENT'}"
             class="post-card">

            <a th:href="@{'/post/view/' + ${post.id}}"
               style="text-decoration:none; color:black;">

                <h3 th:text="${post.title}"></h3>

                <p>By <span th:text="${post.author.username}"></span></p>

                <!-- TOP 3 PREVIEW (safe) -->
                <div th:if="${post.entries != null}">
                    <ul>
                        <li th:each="e, iter : ${post.entries}"
                            th:if="${iter.index < 3}">
                            <span th:text="${e.placement}"></span>.
                            <span th:text="${e.playerName}"></span>
                            -
                            <span th:text="${e.archetype}"></span>
                        </li>
                    </ul>
                </div>

            </a>

            <p>
                👍 <span th:text="${post.likes}"></span>
                👎 <span th:text="${post.dislikes}"></span>
            </p>

        </div>
    </div>

</div>

<!-- PAGINATION -->
<div style="margin-top:20px;">

    <a th:if="${posts.hasPrevious()}"
       th:href="@{/(page=${posts.number - 1}, sort=${sort})}">
        Previous
    </a>

    <span>
        Page <span th:text="${posts.number + 1}"></span>
        of <span th:text="${posts.totalPages}"></span>
    </span>

    <a th:if="${posts.hasNext()}"
       th:href="@{/(page=${posts.number + 1}, sort=${sort})}">
        Next
    </a>

</div>

</body>
</html>
