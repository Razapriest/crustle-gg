<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="page-container">

    <h1>Home</h1>

    <div class="buttons">
        <a href="/post/create-deck-post">Create Deck Post</a>
        <a href="/post/create-tournament-post">Create Tournament Post</a>
    </div>

    <hr>

    <form method="get" action="/" class="card">

        <label>Deck Archetype:</label>
        <select name="archetype">
            <option value="">All</option>
            <option th:each="a : ${T(com.example.demo.model.Archetype).values()}"
                    th:value="${a.name()}"
                    th:text="${a.displayName}">
            </option>
        </select>

        <label>Sort:</label>
        <select name="sort">
            <option value="new" th:selected="${sort == 'new'}">Newest</option>
            <option value="top" th:selected="${sort == 'top'}">Top Rated</option>
        </select>

        <button type="submit">Apply</button>
    </form>

    <hr>

    <div class="container">

        <!-- LEFT: DECKS -->
        <div class="column">
            <h2>Deck Posts</h2>

            <div th:each="post : ${decks}" class="post-card">

                <a th:href="@{'/post/view/' + ${post.id}}">

                    <h3 th:text="${post.title}"></h3>

                    <div th:if="${post.archetype != null}" class="archetype-box">
                        <img th:src="${post.archetype.iconPath}" />
                        <span th:text="${post.archetype.displayName}"></span>
                    </div>

                    <p>By <b th:text="${post.author.username}"></b></p>

                    <img class="post-image"
                         th:src="${post.imagePath != null
                              ? '/uploads/' + post.imagePath
                              : '/uploads/default.png'}" />

                </a>

                <p>
                    👍 <span th:text="${post.likes}"></span>
                    👎 <span th:text="${post.dislikes}"></span>
                </p>

            </div>
        </div>

        <!-- RIGHT: TOURNAMENTS -->
        <div class="column">
            <h2>Tournament Posts</h2>

            <div th:each="post : ${tournaments}" class="post-card">

                <a th:href="@{'/post/view/' + ${post.id}}">

                    <h3 th:text="${post.title}"></h3>

                    <p>By <b th:text="${post.author.username}"></b></p>

                    <img class="post-image"
                         th:src="${post.imagePath != null
                              ? '/uploads/' + post.imagePath
                              : '/uploads/default.png'}" />

                    <div th:if="${post.entries != null}">
                        <ul>
                            <li th:each="e, iter : ${post.entries}"
                                th:if="${iter.index < 3}">

                                <span th:text="${e.placement}"></span>.
                                <span th:text="${e.playerName}"></span>
                                -
                                <span th:text="${e.archetype != null ? e.archetype.displayName : ''}"></span>

                            </li>
                        </ul>
                    </div>

                </a>

                <p>
                    👍 <span th:text="${post.likes}"></span>
                    👎 <span th:text="${post.dislikes}"></span>
                </p>

            </div>
        </div>

    </div>

</div>

</body>
</html>
