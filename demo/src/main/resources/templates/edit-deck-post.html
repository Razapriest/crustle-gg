<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Deck Post</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2>Edit Deck Post</h2>

<form th:action="@{'/post/edit/' + ${post.id}}"
      method="post"
      enctype="multipart/form-data">

    <!-- TITLE -->
    <label>Title</label><br>
    <input type="text"
           name="title"
           th:value="${post.title}"
           required />
    <br><br>

    <!-- IMAGE -->
    <label>Deck Image</label><br>
    <input type="file"
           name="imageFile"
           accept="image/*" />

    <br><br>

    <div th:if="${post.imagePath != null}">
        <p>Current image:</p>
        <img th:src="@{'/uploads/' + ${post.imagePath}}"
             class="preview-img" />
    </div>

    <div th:if="${post.imagePath == null}">
        <p>Current image:</p>
        <img src="/uploads/default.png"
             class="preview-img" />
    </div>

    <br><br>

    <!-- DECK LIST -->
    <label>Deck List</label><br>
    <textarea name="deckList"
              rows="10"
              cols="50"
              required
              th:text="${post.deckList}">
    </textarea>

    <br><br>

    <!-- ARCHETYPE -->
    <label>Archetype</label><br>

    <div class="archetype-picker">

        <input type="text"
               class="archetype-search"
               placeholder="Search archetype..."
               autocomplete="off"
               th:value="${post.archetype != null ? post.archetype.displayName : ''}"
               required />

        <input type="hidden"
               name="archetype"
               class="selected-archetype"
               th:value="${post.archetype != null ? post.archetype.name() : ''}"
               required />

        <div class="archetype-dropdown">

            <div th:each="a : ${archetypes}"
                 class="archetype-option"
                 th:data-value="${a.name()}"
                 th:data-name="${a.displayName}">

                <img th:src="${a.iconPath}" />
                <span th:text="${a.displayName}"></span>

            </div>

        </div>
    </div>

    <br><br>

    <!-- DESCRIPTION -->
    <label>Description</label><br>
    <textarea name="description"
              rows="5"
              cols="50"
              th:text="${post.description}">
    </textarea>

    <br><br>

    <button type="submit">Save Changes</button>

</form>

<br>

<a th:href="@{'/post/' + ${post.id}}">← Back</a>

<script>
    function setupArchetypePicker(container) {
        const search = container.querySelector(".archetype-search");
        const hidden = container.querySelector(".selected-archetype");
        const dropdown = container.querySelector(".archetype-dropdown");

        const options = dropdown.querySelectorAll(".archetype-option");

        search.addEventListener("focus", () => {
            dropdown.style.display = "block";
        });

        search.addEventListener("input", function () {
            const value = this.value.toLowerCase();
            dropdown.style.display = "block";

            options.forEach(option => {
                option.style.display =
                    option.dataset.name.toLowerCase().includes(value)
                        ? "flex"
                        : "none";
            });
        });

        options.forEach(option => {
            option.addEventListener("click", function () {
                search.value = this.dataset.name;
                hidden.value = this.dataset.value;
                dropdown.style.display = "none";
            });
        });

        document.addEventListener("click", function (e) {
            if (!container.contains(e.target)) {
                dropdown.style.display = "none";
            }
        });
    }

    function initAllPickers() {
        document.querySelectorAll(".archetype-picker")
            .forEach(setupArchetypePicker);
    }

    initAllPickers();
</script>

</body>
</html>
