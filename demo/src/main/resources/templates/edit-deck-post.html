<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Deck Post</title>

    <style>
        .archetype-picker {
            position: relative;
            width: 320px;
        }

        .archetype-search {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .archetype-dropdown {
            border: 1px solid #ccc;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            position: absolute;
            width: 100%;
            background: white;
            z-index: 1000;
        }

        .archetype-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            cursor: pointer;
        }

        .archetype-option:hover {
            background-color: #f0f0f0;
        }

        .archetype-option img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .preview-img {
            margin-top: 10px;
            max-width: 200px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<h2>Edit Deck Post</h2>

<form th:action="@{'/post/edit/' + ${post.id}}"
      method="post"
      enctype="multipart/form-data">

    <!-- TITLE -->
    <label>Title</label><br>
    <input type="text"
           name="title"
           th:value="${post.title}"
           required />
    <br><br>

    <!-- IMAGE UPLOAD -->
    <label>Deck Image</label><br>

    <input type="file"
           name="imageFile"
           accept="image/*" />

    <br>

    <!-- CURRENT IMAGE -->
    <div th:if="${post.imagePath != null}">
        <p>Current image:</p>
        <img th:src="@{'/uploads/' + ${post.imagePath}}"
             class="preview-img" />
    </div>

    <!-- fallback -->
    <div th:if="${post.imagePath == null}">
        <p>Current image:</p>
        <img src="/uploads/default.png"
             class="preview-img" />
    </div>

    <br><br>

    <!-- DECK LIST -->
    <label>Deck List</label><br>
    <textarea name="deckList"
              rows="10"
              cols="50"
              required
              th:text="${post.deckList}">
    </textarea>

    <br><br>

    <!-- ARCHETYPE -->
    <label>Archetype:</label><br>

    <div class="archetype-picker">

        <input type="text"
               id="archetypeSearch"
               class="archetype-search"
               placeholder="Search archetype..."
               autocomplete="off"
               th:value="${post.archetype != null ? post.archetype.displayName : ''}"
               required />

        <input type="hidden"
               name="archetype"
               id="selectedArchetype"
               th:value="${post.archetype != null ? post.archetype.name() : ''}"
               required />

        <div id="archetypeDropdown" class="archetype-dropdown">

            <div th:each="a : ${archetypes}"
                 class="archetype-option"
                 th:data-value="${a.name()}"
                 th:data-name="${a.displayName}">

                <img th:src="${a.iconPath}" />
                <span th:text="${a.displayName}"></span>

            </div>

        </div>

    </div>

    <br><br>

    <!-- DESCRIPTION -->
    <label>Description</label><br>
    <textarea name="description"
              rows="5"
              cols="50"
              th:text="${post.description}">
    </textarea>

    <br><br>

    <button type="submit">Save Changes</button>

</form>

<br>

<a th:href="@{'/post/' + ${post.id}}">← Back</a>

<script>
    const searchInput = document.getElementById("archetypeSearch");
    const dropdown = document.getElementById("archetypeDropdown");
    const hiddenInput = document.getElementById("selectedArchetype");
    const options = document.querySelectorAll(".archetype-option");

    searchInput.addEventListener("focus", () => {
        dropdown.style.display = "block";
    });

    searchInput.addEventListener("input", function () {
        const value = this.value.toLowerCase();
        dropdown.style.display = "block";

        options.forEach(option => {
            option.style.display = option.dataset.name.toLowerCase().includes(value)
                ? "flex"
                : "none";
        });
    });

    options.forEach(option => {
        option.addEventListener("click", function () {
            searchInput.value = this.dataset.name;
            hiddenInput.value = this.dataset.value;
            dropdown.style.display = "none";
        });
    });

    document.addEventListener("click", function (e) {
        if (!document.querySelector(".archetype-picker").contains(e.target)) {
            dropdown.style.display = "none";
        }
    });
</script>

</body>
</html>
