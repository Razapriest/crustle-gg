<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<h1 th:text="${profileUser.username}"></h1>

<!-- ========================= -->
<!-- PROFILE IMAGE (UPLOAD-BASED) -->
<!-- ========================= -->
<img class="profile-pic"
     th:src="${profileUser.profileImagePath != null
              ? '/uploads/' + profileUser.profileImagePath
              : '/uploads/default.png'}" />

<p>Score: <span th:text="${score}"></span></p>
<p th:text="${profileUser.description}"></p>

<!-- EDIT PROFILE -->
<div th:if="${currentUser == profileUser.username}">
    <a th:href="@{'/user/edit/' + ${profileUser.username}}">
        Edit Profile
    </a>
</div>

<hr>

<h2>User Posts</h2>

<!-- ========================= -->
<!-- USER POSTS -->
<!-- ========================= -->
<div th:each="post : ${posts}" class="post-card">

    <a th:href="@{'/post/view/' + ${post.id}}"
       style="text-decoration:none; color:black;">

        <h3>
            <span th:text="${post.title}"></span>

            <!-- DECK ARCHETYPE -->
            <span th:if="${post.type.name() == 'DECK' and post.archetype != null}">
                (<span th:text="${post.archetype.displayName}"></span>)
            </span>
        </h3>

        <p th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy HH:mm')}"></p>

        <!-- ========================= -->
        <!-- POST IMAGE (UPLOAD-BASED) -->
        <!-- ========================= -->
        <img style="width:200px; object-fit:cover;"
             th:if="${post.imagePath != null}"
             th:src="@{'/uploads/' + ${post.imagePath}}" />

        <!-- fallback -->
        <img style="width:200px; object-fit:cover;"
             th:if="${post.imagePath == null}"
             src="/uploads/default.png" />

        <!-- ========================= -->
        <!-- TOURNAMENT PREVIEW -->
        <!-- ========================= -->
        <div th:if="${post.type.name() == 'TOURNAMENT' and post.entries != null}">
            <ul>
                <li th:each="e, iter : ${post.entries}"
                    th:if="${iter.index < 3}">
                    <span th:text="${e.placement}"></span>.
                    <span th:text="${e.playerName}"></span>
                    -
                    <span th:text="${e.archetype}"></span>
                </li>
            </ul>
        </div>

    </a>

    <p>
        👍 <span th:text="${post.likes}"></span>
        👎 <span th:text="${post.dislikes}"></span>
    </p>

</div>

</body>
</html>
